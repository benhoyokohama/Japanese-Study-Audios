<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日语听力循环跟读</title>
  <style>
    :root {
      --primary: #4f46e5;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --active-card: #eff6ff;
      --active-border: #3b82f6;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 120px;
    }
    .header {
      max-width: 600px;
      margin: 0 auto 16px;
      text-align: center;
    }
    .header h1 {
      font-size: 1.25rem;
      margin: 0 0 12px;
      color: var(--text);
    }
    .select-wrap {
      margin-bottom: 16px;
    }
    select {
      width: 100%;
      padding: 10px 14px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
    }
    audio {
      width: 100%;
      height: 40px;
      outline: none;
      margin-bottom: 16px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .card.active {
      border-color: var(--active-border);
      background: var(--active-card);
      box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.15);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .play-badge {
      color: var(--primary);
      font-weight: 600;
    }
    .jp-text {
      font-size: 1.15rem;
      line-height: 1.8;
      margin-bottom: 6px;
      font-feature-settings: "palt";
    }
    ruby rt {
      font-size: 0.65em;
      color: var(--text-muted);
      user-select: none;
    }
    .cn-text {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
      margin: 0 auto;
      box-sizing: border-box;
      z-index: 100;
    }
    .current-info {
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 36%;
    }
    .controls {
      display: flex;
      gap: 6px;
    }
    .btn {
      background: #f3f4f6;
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      color: var(--text);
      transition: all 0.15s ease-in-out;
    }
    .btn:active {
      background: #e5e7eb;
    }

    /* 三种模式配色 */
    .btn.mode-single {
      background: #e0e7ff;
      border-color: #6366f1;
      color: #4338ca;
      font-weight: 600;
    }
    .btn.mode-list {
      background: #dcfce7;
      border-color: #22c55e;
      color: #15803d;
      font-weight: 600;
    }
    .btn.mode-seq {
      background: #ffedd5;
      border-color: #f97316;
      color: #c2410c;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🇯🇵 随身日语听力跟读</h1>
    <div class="select-wrap">
      <select id="lesson-select">
        <option value="2026-001">第 1 课：au 无人商店</option>
      </select>
    </div>
    <audio id="audio-player" controls preload="metadata"></audio>
  </div>

  <div class="container" id="sentences-list"></div>

  <div class="bottom-bar">
    <div class="current-info" id="current-badge">准备中...</div>
    <div class="controls">
      <button class="btn" id="prev-btn">◀ 上句</button>
      <button class="btn" id="play-pause-btn">⏸ 暂停</button>
      <button class="btn mode-seq" id="loop-mode-btn">➡️ 顺序播放</button>
      <button class="btn" id="next-btn">下句 ▶</button>
    </div>
  </div>

  <script>
    const audio = document.getElementById('audio-player');
    const select = document.getElementById('lesson-select');
    const list = document.getElementById('sentences-list');
    const badge = document.getElementById('current-badge');
    const loopModeBtn = document.getElementById('loop-mode-btn');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    let sentences = [];
    let currentIndex = -1;

    // 默认进入顺序播放模式 (0: 顺序播放, 1: 单句循环, 2: 列表循环)
    let playMode = 0;
    const modeConfigs = [
      { text: '➡️ 顺序播放', className: 'mode-seq' },
      { text: '🔁 单句循环', className: 'mode-single' },
      { text: '🔄 列表循环', className: 'mode-list' }
    ];

    function updateModeBtn() {
      loopModeBtn.textContent = modeConfigs[playMode].text;
      loopModeBtn.className = 'btn ' + modeConfigs[playMode].className;
    }

    loopModeBtn.onclick = () => {
      playMode = (playMode + 1) % 3;
      updateModeBtn();
    };

    async function loadLesson(lessonId) {
      audio.src = `lessons/${lessonId}.mp3?t=${Date.now()}`;
      try {
        const res = await fetch(`lessons/${lessonId}.json?t=${Date.now()}`);
        if (!res.ok) throw new Error('File not found');
        sentences = await res.json();
        renderList();
        currentIndex = -1;
        badge.textContent = `共 ${sentences.length} 句`;
      } catch (e) {
        list.innerHTML = '<p style="text-align:center;color:red;padding:20px;">数据加载失败，请检查 lessons/' + lessonId + '.json 文件</p>';
      }
    }

    function renderList() {
      list.innerHTML = sentences.map((s, idx) => `
        <div class="card" id="card-${idx}" onclick="playSentence(${idx})">
          <div class="card-header">
            <span>句 ${s.id} [${s.start.toFixed(2)}s - ${s.end.toFixed(2)}s]</span>
            <span class="play-badge">点击播放 🔊</span>
          </div>
          <div class="jp-text">${s.jp}</div>
          <div class="cn-text">${s.cn}</div>
        </div>
      `).join('');
    }

    window.playSentence = function(idx) {
      if (idx < 0 || idx >= sentences.length) return;
      currentIndex = idx;
      updateUI();
      audio.currentTime = sentences[idx].start;
      audio.play().catch(() => {});
    };

    function updateUI() {
      document.querySelectorAll('.card').forEach((c, idx) => {
        c.classList.toggle('active', idx === currentIndex);
      });
      if (currentIndex >= 0 && currentIndex < sentences.length) {
        const s = sentences[currentIndex];
        badge.innerHTML = `<strong>句 ${s.id}</strong> ${s.jp.replace(/<[^>]+>/g, '').slice(0, 10)}...`;
        const card = document.getElementById(`card-${currentIndex}`);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }
    }

    // 核心播放控制监听
    audio.addEventListener('timeupdate', () => {
      const cur = audio.currentTime;
      if (sentences.length === 0) return;

      // 1. 只有在【单句循环】(playMode === 1) 下，到达当前句尾时才强行跳回句首
      if (playMode === 1 && currentIndex >= 0 && currentIndex < sentences.length) {
        const s = sentences[currentIndex];
        if (cur >= s.end) {
          audio.currentTime = s.start;
          audio.play().catch(() => {});
          return;
        }
      }

      // 2. 在【顺序播放】或【列表循环】下，音频自然向下流淌，只根据时间更新高亮卡片
      const idx = sentences.findIndex(s => cur >= s.start && cur < s.end);
      if (idx !== -1 && idx !== currentIndex) {
        currentIndex = idx;
        updateUI();
      }
    });

    // 整篇文章播放到达末尾时处理
    audio.addEventListener('ended', () => {
      if (playMode === 2) {
        // 列表循环：整篇放完，从第 0 句重新播放
        playSentence(0);
      } else {
        // 顺序播放：整篇放完，自然停止，不再重复
        audio.pause();
        badge.textContent = '整篇播放完毕';
      }
    });

    audio.addEventListener('play', () => playPauseBtn.textContent = '⏸ 暂停');
    audio.addEventListener('pause', () => playPauseBtn.textContent = '▶ 播放');

    playPauseBtn.onclick = () => {
      if (audio.paused) {
        if (currentIndex === -1 && sentences.length > 0) playSentence(0);
        else audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    };

    prevBtn.onclick = () => {
      if (currentIndex > 0) playSentence(currentIndex - 1);
      else if (sentences.length > 0) playSentence(sentences.length - 1);
    };

    nextBtn.onclick = () => {
      if (currentIndex + 1 < sentences.length) playSentence(currentIndex + 1);
      else if (sentences.length > 0) playSentence(0);
    };

    select.onchange = () => loadLesson(select.value);

    // 默认加载第 1 课
    loadLesson(select.value);
  </script>
</body>
</html>
