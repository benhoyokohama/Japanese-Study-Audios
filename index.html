<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>随身日语听力跟读</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- 系统级媒体流播放核心，支持 iOS/Android 锁屏熄屏后台播放与原生保真变调 -->
  <audio id="coreAudio" playsinline preload="auto"></audio>

  <header>
    <div class="header-top">
      <h1>🇯🇵 随身日语</h1>
      <div class="control-selects">
        <select id="lessonSelect" class="nav-select" title="选择课程">
          <option value="2026-100">第 100 课：中田敦彦・止まらない円安と骨太ショック</option>
          <option value="2026-101">第 101 课：中田敦彦・止まらない円安と骨太ショック（二）</option>
          <option value="2026-200">第 200 课：信長から秀吉の台頭へ</option>
          <option value="2026-201">第 201 课：秀吉の全国統一と大坂城</option>
          <option value="2026-300">第 300 课：N3 词汇·第一单元 (1) [1-1~1-30]</option>
          <option value="2026-301">第 301 课：N3 词汇·第一单元 (2) [1-31~1-60]</option>
          <option value="2026-302">第 302 课：N3 词汇·第一单元 (3) [1-61~1-90]</option>
          <option value="2026-303">第 303 课：N3 词汇·第一单元 (4) [1-91~1-120]</option>
          <option value="2026-304">第 304 课：N3 词汇·第二单元 (1) [2-1~2-30]</option>
          <option value="2026-305">第 305 课：N3 词汇·第二单元 (2) [2-31~2-60]</option>
          <option value="2026-306">第 306 课：N3 词汇·第二单元 (3) [2-61~2-90]</option>
          <option value="2026-307">第 307 课：N3 词汇·第二单元 (4) [2-91~2-120]</option>
          <option value="2026-308">第 308 课：N3 词汇·第三单元 (1) [3-1~3-30]</option>
          <option value="2026-309">第 309 课：N3 词汇·第三单元 (2) [3-31~3-60]</option>
          <option value="2026-310">第 310 课：N3 词汇·第三单元 (3) [3-61~3-90]</option>
          <option value="2026-311">第 311 课：N3 词汇·第三单元 (4) [3-91~3-120]</option>
        </select>
        <select id="speedSelect">
          <option value="0.8">0.8x</option>
          <option value="1.0" selected>1.0x</option>
          <option value="1.2">1.2x</option>
          <option value="1.5">1.5x</option>
        </select>
        <select id="timerSelect">
          <option value="0">⏱ 关</option>
          <option value="15">⏱ 15m</option>
          <option value="30">⏱ 30m</option>
          <option value="60">⏱ 60m</option>
        </select>
      </div>
    </div>
    <div class="progress-bar-wrap">
      <button class="top-play-btn" id="topPlayBtn">▶</button>
      <span id="timeCurrent">0:00</span>
      <input type="range" id="seekSlider" class="custom-range" min="0" max="100" value="0">
      <span id="timeDuration">0:00</span>
    </div>
  </header>

  <main class="container" id="cardsList"></main>

  <footer>
    <div class="footer-left" id="statusText">正在初始化...</div>
    <div class="footer-controls">
      <button class="ctrl-btn" id="btnPrev" onclick="prevSentence()">◀ 上句</button>
      <button class="ctrl-btn primary" id="btnPlayPause" onclick="togglePlayPause()">▶ 播放</button>
      <button class="ctrl-btn" id="btnLoopMode" onclick="toggleLoopMode()">🔁 全文循环</button>
      <button class="ctrl-btn" id="btnNext" onclick="nextSentence()">下句 ▶</button>
    </div>
  </footer>
  <script src="./lessons-config.js?v=u3_done"></script>
  <script src="./app.js?v=mem2"></script>
</body>
</html>
