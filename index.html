<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日语听力循环跟读</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --active-card: #eff6ff;
      --active-border: #3b82f6;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 120px;
    }
    .header {
      max-width: 600px;
      margin: 0 auto 16px;
      text-align: center;
    }
    .header h1 {
      font-size: 1.25rem;
      margin: 0 0 12px;
      color: var(--text);
    }
    .select-wrap {
      margin-bottom: 16px;
    }
    select {
      width: 100%;
      padding: 10px 14px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
    }
    audio {
      width: 100%;
      height: 40px;
      outline: none;
      margin-bottom: 16px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .card.active {
      border-color: var(--active-border);
      background: var(--active-card);
      box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.15);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .play-badge {
      color: var(--primary);
      font-weight: 600;
    }
    .jp-text {
      font-size: 1.15rem;
      line-height: 1.8;
      margin-bottom: 6px;
      font-feature-settings: "palt";
    }
    ruby rt {
      font-size: 0.65em;
      color: var(--text-muted);
      user-select: none;
    }
    .cn-text {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
      margin: 0 auto;
      box-sizing: border-box;
      z-index: 100;
    }
    .current-info {
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 36%;
    }
    .controls {
      display: flex;
      gap: 6px;
    }
    .btn {
      background: #f3f4f6;
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      color: var(--text);
    }
    .btn:active {
      background: #e5e7eb;
    }
    .btn.active {
      background: #e0e7ff;
      border-color: #818cf8;
      color: var(--primary);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🇯🇵 随身日语听力跟读</h1>
    <div class="select-wrap">
      <select id="lesson-select">
        <option value="2026-001">第 1 课：au 无人商店</option>
        <option value="2026-002">第 2 课：FRB加息</option>
        <option value="2026-003">第 3 课：自动驾驶出租车 (NHK)</option>
        <option value="2026-004">第 4 课：年轻人结婚意愿 (NHK)</option>
        <option value="2026-005">第 5 课：大塚家具配送确认电话</option>
        <option value="2026-006">第 6 课：火星卫星探测器MMX (NHK)</option>
        <option value="2026-007">第 7 课：文京区女性失踪事件 (News)</option>
        <option value="2026-008">第 8 课：美国物价上涨与CPI (News)</option>
        <option value="2026-012">第 12 课：中田敦彦-止不住的日元贬值(1)</option>
      </select>
    </div>
    <audio id="audio-player" controls preload="metadata"></audio>
  </div>

  <div class="container" id="sentences-list"></div>

  <div class="bottom-bar">
    <div class="current-info" id="current-badge">准备中...</div>
    <div class="controls">
      <button class="btn" id="prev-btn">◀ 上句</button>
      <button class="btn" id="play-pause-btn">⏸ 暂停</button>
      <button class="btn active" id="loop-mode-btn">🔁 单句循环</button>
      <button class="btn" id="next-btn">下句 ▶</button>
    </div>
  </div>

  <script>
    const audio = document.getElementById('audio-player');
    const select = document.getElementById('lesson-select');
    const list = document.getElementById('sentences-list');
    const badge = document.getElementById('current-badge');
    const loopModeBtn = document.getElementById('loop-mode-btn');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    let sentences = [];
    let currentIndex = -1;

    // 0: 单句循环, 1: 列表循环, 2: 顺序播放
    let playMode = 0;
    const modeConfigs = [
      { text: '🔁 单句循环', active: true },
      { text: '🔄 列表循环', active: true },
      { text: '➡️ 顺序播放', active: false }
    ];

    function updateModeBtn() {
      loopModeBtn.textContent = modeConfigs[playMode].text;
      loopModeBtn.classList.toggle('active', modeConfigs[playMode].active);
    }

    loopModeBtn.onclick = () => {
      playMode = (playMode + 1) % 3;
      updateModeBtn();
    };

    async function loadLesson(lessonId) {
      audio.src = `lessons/${lessonId}.mp3?t=${Date.now()}`;
      try {
        const res = await fetch(`lessons/${lessonId}.json?t=${Date.now()}`);
        if (!res.ok) throw new Error('File not found');
        sentences = await res.json();
        renderList();
        currentIndex = -1;
        badge.textContent = `共 ${sentences.length} 句`;
      } catch (e) {
        list.innerHTML = '<p style="text-align:center;color:red;padding:20px;">数据加载失败，请检查 lessons/' + lessonId + '.json 文件</p>';
      }
    }

    function renderList() {
      list.innerHTML = sentences.map((s, idx) => `
        <div class="card" id="card-${idx}" onclick="playSentence(${idx})">
          <div class="card-header">
            <span>句 ${s.id} [${s.start.toFixed(2)}s - ${s.end.toFixed(2)}s]</span>
            <span class="play-badge">点击播放 🔊</span>
          </div>
          <div class="jp-text">${s.jp}</div>
          <div class="cn-text">${s.cn}</div>
        </div>
      `).join('');
    }

    window.playSentence = function(idx) {
      if (idx < 0 || idx >= sentences.length) return;
      currentIndex = idx;
      updateUI();
      audio.currentTime = sentences[idx].start;
      audio.play().catch(() => {});
    };

    function updateUI() {
      document.querySelectorAll('.card').forEach((c, idx) => {
        c.classList.toggle('active', idx === currentIndex);
      });
      if (currentIndex >= 0) {
        const s = sentences[currentIndex];
        badge.innerHTML = `<strong>句 ${s.id}</strong> ${s.jp.replace(/<[^>]+>/g, '').slice(0, 10)}...`;
        const card = document.getElementById(`card-${currentIndex}`);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }
    }

    // 核心循环控制逻辑
    function handleSentenceEnd() {
      if (currentIndex < 0 || currentIndex >= sentences.length) return;
      const s = sentences[currentIndex];

      if (playMode === 0) {
        // 1. 单句循环：强制回到句首重新起播
        audio.currentTime = s.start;
        audio.play().catch(() => {});
      } else if (playMode === 1) {
        // 2. 列表循环：下句，到底回到第0句
        if (currentIndex + 1 < sentences.length) {
          playSentence(currentIndex + 1);
        } else {
          playSentence(0);
        }
      } else {
        // 3. 顺序播放：下句，到底暂停
        if (currentIndex + 1 < sentences.length) {
          playSentence(currentIndex + 1);
        } else {
          audio.pause();
        }
      }
    }

    // 高频监听进度，提前 0.05 秒捕获句尾，防止浏览器原生卡顿
    audio.addEventListener('timeupdate', () => {
      const cur = audio.currentTime;
      if (currentIndex >= 0) {
        const s = sentences[currentIndex];
        if (cur >= s.end - 0.05) {
          handleSentenceEnd();
        }
      } else {
        const idx = sentences.findIndex(s => cur >= s.start && cur < s.end);
        if (idx !== -1 && idx !== currentIndex) {
          currentIndex = idx;
          updateUI();
        }
      }
    });

    // 防止音频自然播放到文件末尾时停止触发
    audio.addEventListener('ended', () => {
      handleSentenceEnd();
    });

    audio.addEventListener('play', () => playPauseBtn.textContent = '⏸ 暂停');
    audio.addEventListener('pause', () => playPauseBtn.textContent = '▶ 播放');

    playPauseBtn.onclick = () => {
      if (audio.paused) {
        if (currentIndex === -1 && sentences.length > 0) playSentence(0);
        else audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    };

    prevBtn.onclick = () => {
      if (currentIndex > 0) playSentence(currentIndex - 1);
      else if (sentences.length > 0) playSentence(sentences.length - 1);
    };

    nextBtn.onclick = () => {
      if (currentIndex + 1 < sentences.length) playSentence(currentIndex + 1);
      else if (sentences.length > 0) playSentence(0);
    };

    select.onchange = () => loadLesson(select.value);

    // 默认加载选中的课程
    loadLesson(select.value);
  </script>
</body>
</html>
