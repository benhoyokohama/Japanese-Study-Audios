<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日语听力循环跟读</title>
  <style>
    :root {
      --primary: #4F46E5;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #64748B;
      --highlight: #EEF2FF;
      --border: #E2E8F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding-bottom: 120px;
    }
    .header {
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      z-index: 50;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    h1 { font-size: 1.1rem; font-weight: 700; }
    select {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }
    audio { width: 100%; height: 36px; }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .card.active {
      border-color: var(--primary);
      background: var(--highlight);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12);
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    .jp-text {
      font-size: 1.15rem;
      line-height: 1.9;
      margin-bottom: 8px;
      word-break: break-all;
    }
    ruby rt {
      font-size: 0.65em;
      color: var(--primary);
    }
    .cn-text {
      font-size: 0.9rem;
      color: var(--text-sub);
      line-height: 1.5;
    }
    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
      margin: 0 auto;
      z-index: 50;
    }
    .controls-group {
      display: flex;
      gap: 8px;
    }
    .btn {
      background: #fff;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-top">
      <h1>🇯🇵 随身日语听力跟读</h1>
    </div>
    <select id="lessonSelect" onchange="switchLesson(this.value)">
      <option value="2026-001">第 1 课：au 无人商店</option>
      <option value="2026-002">第 2 课：FRB金利をあげる</option>
      <option value="2026-003">第 3 课：自動運転タクシー</option>
        <option value="2026-004">第 4 课：結婚したい若い人</option>
      <option value="2026-005">第 5 课：秀吉の全国統一と大坂城</option>
      <option value="2026-006">第 6 课：信長から秀吉の台頭へ</option>
      <option value="2026-010">第 10 课：食中毒の予防と注意点</option>
      <option value="2026-011">第 11 课：4〜6月期GDP改定値</option>
      <option value="2026-012">第 12 课：火星衛星探査機MMXの打ち上げ</option>
      <option value="2026-013">第 13 课：行方不明事件の捜査</option>
      <option value="2026-014">第 14 课：米消費者物価指数40年ぶり高水準</option>
      <option value="2026-100">第 100 课：中田敦彦・止まらない円安と骨太ショック</option>
    </select>
    <audio id="audioPlayer" controls preload="metadata"></audio>
  </div>

  <div class="container" id="sentencesList"></div>

  <div class="footer-bar">
    <div id="stats" style="font-size: 0.85rem; color: var(--text-sub);">加载中...</div>
    <div class="controls-group">
      <button class="btn" id="prevBtn" onclick="prevSentence()">◀ 上句</button>
      <button class="btn primary" id="playPauseBtn" onclick="togglePlay()">⏸ 暂停</button>
      <button class="btn" id="modeBtn" onclick="toggleMode()">🔁 列表循环</button>
      <button class="btn" id="timerBtn" onclick="toggleTimer()">⏱ 定时关闭</button>
      <button class="btn" id="nextBtn" onclick="nextSentence()">下句 ▶</button>
    </div>
  </div>

  <script>
    const audio = document.getElementById('audioPlayer');
    const container = document.getElementById('sentencesList');
    const stats = document.getElementById('stats');
    const modeBtn = document.getElementById('modeBtn');
    const timerBtn = document.getElementById('timerBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');

    let sentences = [];
    let currentIndex = 0;
    // 播放模式: 'loop' (列表循环) -> 'single' (单句循环) -> 'order' (顺序播放)
    let playMode = 'loop';

    // --- 定时停止逻辑 ---
    let timerDuration = 0; // 0, 900, 1800, 3600
    let timerRemaining = 0;
    let timerInterval = null;

    function toggleTimer() {
      if (timerDuration === 0) {
        startTimer(15 * 60);
      } else if (timerDuration === 15 * 60) {
        startTimer(30 * 60);
      } else if (timerDuration === 30 * 60) {
        startTimer(60 * 60);
      } else {
        clearTimer();
      }
    }

    function startTimer(seconds) {
      timerDuration = seconds;
      timerRemaining = seconds;
      updateTimerDisplay();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!audio.paused) {
          timerRemaining--;
          updateTimerDisplay();
          if (timerRemaining <= 0) {
            audio.pause();
            playPauseBtn.innerText = '▶️ 播放';
            clearTimer();
            alert('⏱ 定时时间已到，已自动停止播放。');
          }
        }
      }, 1000);
    }

    function clearTimer() {
      timerDuration = 0;
      timerRemaining = 0;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      timerBtn.innerText = '⏱ 定时关闭';
    }

    function updateTimerDisplay() {
      if (timerDuration === 0) {
        timerBtn.innerText = '⏱ 定时关闭';
      } else {
        const m = Math.floor(timerRemaining / 60);
        const s = timerRemaining % 60;
        timerBtn.innerText = `⏱ ${m}:${s < 10 ? '0' : ''}${s}`;
      }
    }

    // --- 播放模式切换 ---
    function toggleMode() {
      if (playMode === 'loop') {
        playMode = 'single';
        modeBtn.innerText = '🔂 单句循环';
      } else if (playMode === 'single') {
        playMode = 'order';
        modeBtn.innerText = '➡️ 顺序播放';
      } else {
        playMode = 'loop';
        modeBtn.innerText = '🔁 列表循环';
      }
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playPauseBtn.innerText = '⏸ 暂停';
      } else {
        audio.pause();
        playPauseBtn.innerText = '▶️ 播放';
      }
    }

    async function loadLesson(lessonId) {
      try {
        audio.src = `lessons/${lessonId}.mp3`;
        const res = await fetch(`lessons/${lessonId}.json`);
        sentences = await res.json();
        renderSentences();
        currentIndex = 0;
        stats.innerText = `共 ${sentences.length} 句`;
      } catch (e) {
        console.error('加载失败:', e);
      }
    }

    function switchLesson(lessonId) {
      loadLesson(lessonId);
    }

    function renderSentences() {
      container.innerHTML = '';
      sentences.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `card ${index === currentIndex ? 'active' : ''}`;
        div.id = `card-${index}`;
        div.onclick = () => playSentence(index);
        div.innerHTML = `
          <div class="card-meta">
            <span>句 ${item.id} [${item.start.toFixed(2)}s - ${item.end.toFixed(2)}s]</span>
            <span style="color: var(--primary);">点击播放 🔊</span>
          </div>
          <div class="jp-text">${item.jp}</div>
          <div class="cn-text">${item.cn}</div>
        `;
        container.appendChild(div);
      });
    }

    function playSentence(index) {
      if (index < 0 || index >= sentences.length) return;
      currentIndex = index;
      updateActiveCard();
      audio.currentTime = sentences[index].start;
      audio.play();
      playPauseBtn.innerText = '⏸ 暂停';
    }

    function updateActiveCard() {
      document.querySelectorAll('.card').forEach((el, i) => {
        if (i === currentIndex) {
          el.classList.add('active');
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          el.classList.remove('active');
        }
      });
    }

    function prevSentence() {
      if (currentIndex > 0) playSentence(currentIndex - 1);
    }

    function nextSentence() {
      if (currentIndex < sentences.length - 1) playSentence(currentIndex + 1);
    }

    // 统一处理句子结束与循环逻辑
    function handleSentenceEnd() {
      if (!sentences.length) return;
      const lessonSelect = document.getElementById('lessonSelect');
      const options = Array.from(lessonSelect.options);
      const currentOptIndex = lessonSelect.selectedIndex;

      if (playMode === 'single') {
        // 单句循环：单句无限复读
        audio.currentTime = sentences[currentIndex].start;
        audio.play();
      } else if (playMode === 'loop') {
        // 列表循环：仅在本课内大循环
        if (currentIndex < sentences.length - 1) {
          playSentence(currentIndex + 1);
        } else {
          // 本课播完，回到本课第 1 句重新开播
          playSentence(0);
        }
      } else if (playMode === 'order') {
        // 顺序播放：自动切下一课
        if (currentIndex < sentences.length - 1) {
          playSentence(currentIndex + 1);
        } else {
          // 当前课播完，自动切到下一课（最后一课则回第 1 课）并从第 1 句播放
          const nextOptIndex = (currentOptIndex + 1) % options.length;
          lessonSelect.selectedIndex = nextOptIndex;
          loadLesson(options[nextOptIndex].value).then(() => {
            playSentence(0);
          });
        }
      }
    }

    audio.addEventListener('timeupdate', () => {
      if (!sentences.length) return;
      const cur = audio.currentTime;
      const current = sentences[currentIndex];
      // 容差判断
      if (cur >= current.end - 0.2) {
        handleSentenceEnd();
      }
    });

    // 针对整首音频自然结束的强保险监听
    audio.addEventListener('ended', () => {
      // 只要音频自然放完，直接视作最后一句结束
      currentIndex = sentences.length - 1;
      handleSentenceEnd();
    });

    audio.addEventListener('play', () => playPauseBtn.innerText = '⏸ 暂停');
    audio.addEventListener('pause', () => playPauseBtn.innerText = '▶️ 播放');

    // 默认加载第一课
    loadLesson('2026-001');
  </script>
</body>
</html>
